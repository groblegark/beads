# GoReleaser config for groblegark/beads fork releases.
# CGO required for dolthub deps (gozstd, go-mysql-server regex, icu4c).
# Linux: native gcc. Darwin: zig cross-compiler (installed in RWX pipeline).

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: bd-linux-amd64
    main: ./cmd/bd
    binary: bd
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Build={{.ShortCommit}}
      - -X main.Commit={{.Commit}}

  - id: bd-darwin-amd64
    main: ./cmd/bd
    binary: bd
    env:
      - CGO_ENABLED=1
      - CC=/tmp/zigcc/cc-x86_64-macos
      - CGO_CFLAGS=-DZSTD_DISABLE_ASM -DDEACTIVATE_SIMD
    tags:
      - gms_pure_go
      - netgo
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w -linkmode internal
      - -X main.Version={{.Version}}
      - -X main.Build={{.ShortCommit}}
      - -X main.Commit={{.Commit}}

  - id: bd-darwin-arm64
    main: ./cmd/bd
    binary: bd
    env:
      - CGO_ENABLED=1
      - CC=/tmp/zigcc/cc-aarch64-macos
      - CGO_CFLAGS=-DZSTD_DISABLE_ASM -DDEACTIVATE_SIMD
    tags:
      - gms_pure_go
      - netgo
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w -linkmode internal
      - -X main.Version={{.Version}}
      - -X main.Build={{.ShortCommit}}
      - -X main.Commit={{.Commit}}

archives:
  - id: bd-archive
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  name_template: "{{.Version}}"

announce:
  skip: true

{{- if .Values.daemon.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bd-daemon.daemon.fullname" . }}
  labels:
    {{- include "bd-daemon.daemon.labels" . | nindent 4 }}
type: Opaque
data:
  daemon-token: {{ .Values.daemon.token | b64enc | quote }}
{{- end }}
{{- if and .Values.anthropicApiKey.key (not .Values.anthropicApiKey.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bd-daemon.daemon.fullname" . }}-anthropic
  labels:
    {{- include "bd-daemon.daemon.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.anthropicApiKey.key | b64enc | quote }}
{{- end }}

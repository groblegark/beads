{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.slackBotCredentials.enabled .Values.externalSecrets.slackBotCredentials.remoteRef }}
---
# Slack bot credentials from secret store
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.slackBot.secretName | default "slack-bot-credentials" }}
  labels:
    {{- include "bd-daemon.daemon.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.slackBot.secretName | default "slack-bot-credentials" }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        bot-token: '{{`{{ .botToken }}`}}'
        app-token: '{{`{{ .appToken }}`}}'
  data:
    - secretKey: botToken
      remoteRef:
        key: {{ .Values.externalSecrets.slackBotCredentials.remoteRef | quote }}
        property: {{ .Values.externalSecrets.slackBotCredentials.botTokenProperty | default "bot-token" | quote }}
    - secretKey: appToken
      remoteRef:
        key: {{ .Values.externalSecrets.slackBotCredentials.remoteRef | quote }}
        property: {{ .Values.externalSecrets.slackBotCredentials.appTokenProperty | default "app-token" | quote }}
{{- end }}
{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.registryCredentials.enabled }}
{{- range .Values.externalSecrets.registryCredentials.registries }}
---
# {{ .name }} registry credentials from secret store
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}-auth
  labels:
    {{- include "bd-daemon.daemon.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.registryCredentials.refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ $.Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      metadata: {}
      data:
        .dockerconfigjson: |
          {
            "auths": {
              {{- $hosts := .hosts | default (list .host) }}
              {{- range $i, $host := $hosts }}
              {{- if $i }},{{ end }}
              "{{ $host }}": {
                "username": "{{`{{ .username }}`}}",
                "password": "{{`{{ .password }}`}}",
                "auth": "{{`{{ (printf "%s:%s" .username .password) | b64enc }}`}}"
              }
              {{- end }}
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "remoteRef is required for registry credentials" .remoteRef | quote }}
        property: {{ .usernameProperty | default "username" | quote }}
    - secretKey: password
      remoteRef:
        key: {{ .remoteRef | quote }}
        property: {{ .passwordProperty | default "password" | quote }}
{{- end }}
{{- end }}

# bd-daemon Helm chart values
# All new features (Dolt StatefulSet, Slack bot, ExternalSecrets, Ingress) are
# disabled by default for backward compatibility.

# --- Daemon image ---
image:
  repository: ghcr.io/steveyegge/beads
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Daemon configuration ---
daemon:
  replicaCount: 1
  deploymentStrategy: Recreate

  # Rolling update params (only used when deploymentStrategy: RollingUpdate)
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

  # Token for RPC authentication
  token: ""

  # Logging
  logLevel: "info"
  logJSON: true

  # TCP RPC listener
  tcp:
    addr: ":9876"
    port: 9876

  # HTTP API listener (health checks, ingress)
  http:
    enabled: true
    addr: ":9080"
    port: 9080

  # TLS
  tls:
    enabled: false
    existingSecret: ""

  # Priority class (e.g., "production")
  priorityClassName: ""

  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Service
  service:
    type: ClusterIP
    port: 9876
    httpPort: 9080

  # Health probes
  startupProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Pod disruption budget
  pdb:
    enabled: false
    maxUnavailable: 0

  # Resources
  resources: {}
    # limits:
    #   cpu: 2
    #   memory: 4Gi
    # requests:
    #   cpu: 500m
    #   memory: 1Gi

  # Scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Dolt database ---
dolt:
  # Deploy Dolt as a StatefulSet within the chart
  statefulSet:
    enabled: false

  # OR connect to an external Dolt sql-server (used when statefulSet.enabled=false)
  serverMode:
    host: "dolt-sql-server"
    port: 3307
    user: "root"
    database: "beads"
    # existingSecret: ""
    # existingSecretKey: "dolt-password"

  # Database name
  database: "beads"

  # Dolt image (used when statefulSet.enabled=true)
  image:
    repository: dolthub/dolt-sql-server
    tag: "1.81.6"
    pullPolicy: IfNotPresent

  # User for server config
  user:
    name: "root"

  # Dolt SQL server configuration
  config:
    host: "0.0.0.0"
    port: 3306
    log_level: info
    max_connections: 100
    read_timeout_millis: 28800000
    write_timeout_millis: 28800000

  # Performance tuning (Dolt config.yaml performance section)
  # query_parallelism controls parallel query execution. null = Dolt default (single-threaded).
  # Set to number of CPU cores available to improve concurrent query throughput.
  performance: {}
    # query_parallelism: 2

  # System variables set at server startup (Dolt config.yaml system_variables section)
  # These override Dolt/MySQL system variable defaults.
  system_variables: {}

  # Service
  service:
    type: ClusterIP
    port: 3306

  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # S3 backup/sync
  s3:
    enabled: false
    region: "us-east-1"
    bucket: ""
    prefix: ""
    dynamoTable: ""
    credentials:
      enabled: false
      secretName: "dolt-s3-credentials"
    sync:
      pullOnStartup: true
      pushOnShutdown: true
      schedule:
        enabled: false
        intervalMinutes: 60
        gcEveryNCycles: 12
        squashEveryNCycles: 48
        squashThreshold: 100

  # EKS Pod Identity for S3 access (alternative to static credentials)
  podIdentity:
    enabled: false
    clusterName: ""
    roleArn: ""

  # Persistence (PVC for StatefulSet)
  persistence:
    enabled: true
    storageClass: "gp3"
    accessMode: ReadWriteOnce
    size: 10Gi
    deleteClaim: false

  # HA cluster (standby replication)
  cluster:
    enabled: false
    replicas: 1              # Set to 3 for HA
    remotesapiPort: 50051    # Port for inter-node replication
    bootstrapEpoch: 1        # Increment on manual failover
    peerProbeTimeout: 3      # Seconds to wait for peer remotesapi probe at startup
    # doltclusterctl label controller
    clusterctl:
      enabled: true          # Deploy CronJob to apply primary/standby labels
      autoFailover: false    # Auto-promote standby if no primary found
      image:
        repository: dolthub/doltclusterctl
        tag: "latest"
        pullPolicy: IfNotPresent
      schedule: "*/1 * * * *"  # Every minute
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

  # Prometheus metrics endpoint
  metrics:
    enabled: false
    host: "0.0.0.0"
    port: 9100

  # Init SQL script (optional)
  initSql: ""

  # Termination grace period (seconds)
  terminationGracePeriodSeconds: 120

  # Security contexts
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false

  # Health probes
  startupProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Pod disruption budget
  pdb:
    enabled: false
    maxUnavailable: 0

  # Resources
  resources:
    requests:
      cpu: 2000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 2Gi

  # Scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Anthropic API key ---
# Long-lived API key for Claude access. Replaces the previous OAuth token
# refresh flow. The key can be provided:
#   1. Directly in values (anthropicApiKey.key) — creates a K8s Secret
#   2. Via an existing K8s Secret (anthropicApiKey.existingSecret)
#   3. Via ExternalSecrets (externalSecrets.anthropicApiKey)
anthropicApiKey:
  # Static API key (creates a K8s Secret; use existingSecret for pre-created secrets)
  key: ""
  # Name of an existing K8s Secret containing the API key (key: "api-key")
  existingSecret: ""

# --- Slack bot ---
# When standalone=false (default), runs as a sidecar in the daemon pod.
# When standalone=true, runs as a separate single-replica Deployment.
# Use standalone mode when running multiple daemon replicas (HA) to avoid
# duplicate Slack Socket Mode connections.
slackBot:
  enabled: false
  standalone: false
  image:
    repository: ""  # Defaults to main image.repository
    tag: ""         # Defaults to main image.tag
    pullPolicy: ""  # Defaults to main image.pullPolicy
  secretName: "slack-bot-credentials"
  channelID: ""  # Default Slack channel ID (or set via SLACK_CHANNEL env)
  healthPort: 8080  # Health check port for liveness/readiness probes
  livenessProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /readyz  # Fails when Socket Mode num_connections > 1 (bd-4yp0j)
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- External Secrets Operator ---
externalSecrets:
  enabled: false
  refreshInterval: "15m"
  secretStoreKind: ClusterSecretStore
  secretStoreName: ""  # Name of your ClusterSecretStore/SecretStore

  # Dolt root password
  doltRootPassword:
    remoteRef: ""      # Secret key in your secret store
    property: ""       # Property within the secret (if JSON)

  # S3 credentials
  doltS3Credentials:
    enabled: false
    remoteRef: ""
    accessKeyIdProperty: "aws_access_key_id"
    secretAccessKeyProperty: "aws_secret_access_key"

  # Daemon token
  daemonToken:
    remoteRef: ""
    property: ""

  # Anthropic API key
  anthropicApiKey:
    enabled: false
    remoteRef: ""
    property: ""       # Property within the secret (if JSON)

  # Slack bot credentials
  slackBotCredentials:
    enabled: false
    remoteRef: ""
    botTokenProperty: "bot-token"
    appTokenProperty: "app-token"

  # Container registry credentials (creates kubernetes.io/dockerconfigjson secrets)
  # Use this to auto-manage imagePullSecrets via ExternalSecrets instead of
  # manually creating registry secrets that can expire.
  registryCredentials:
    enabled: false
    refreshInterval: "1h"
    registries: []
    # Example: GitLab Container Registry + Docker Hub
    # registries:
    #   - name: gitlab-registry
    #     secretName: gitlab-registry
    #     host: registry.gitlab.com
    #     remoteRef: "arn:aws:secretsmanager:us-east-1:...:secret:gitlab-registry-XXXXX"
    #     usernameProperty: username
    #     passwordProperty: password
    #   - name: docker-hub
    #     secretName: docker-hub-registry
    #     hosts:    # Use 'hosts' for multiple entries, or 'host' for a single one
    #       - docker.io
    #       - https://index.docker.io/v1/
    #     remoteRef: "arn:aws:secretsmanager:us-east-1:...:secret:docker-hub-XXXXX"
    #     usernameProperty: username
    #     passwordProperty: password

# --- Ingress (Traefik IngressRoute) ---
ingress:
  enabled: false
  host: ""
  entryPoints:
    - web
    - websecure
  ipWhitelist:
    enabled: false
    sourceRange: []
    # ipStrategy.depth tells Traefik how many proxy hops to skip in
    # X-Forwarded-For when determining the client IP. Behind an ALB,
    # depth=1 means "use the IP the ALB added" (the real client).
    ipStrategyDepth: 1
  rateLimit:
    enabled: false
    average: 50
    burst: 100

# --- Redis WispStore ---
redis:
  enabled: false

  # Key namespace prefix
  namespace: "bd"

  # TTL for wisp entries
  wispTTL: "24h"

  # Bitnami Redis subchart overrides.
  # architecture: standalone | replication
  #   standalone — single master, no HA (default)
  #   replication — 1 master + N replicas; add sentinel.enabled=true for auto-failover
  architecture: standalone
  auth:
    enabled: true
    password: ""

  master:
    persistence:
      enabled: false  # Wisps are ephemeral

  # Replica configuration (active when architecture != standalone).
  replica:
    replicaCount: 0
    persistence:
      enabled: false

  # Sentinel configuration (active when architecture == sentinel).
  sentinel:
    enabled: false
    masterSet: bdmaster
    quorum: 2

# --- NATS event bus ---
nats:
  enabled: false

  # Deploys a NATS server (StatefulSet + Service + ConfigMap).
  # When enabled, the daemon connects as a client (BD_NATS_URL) instead
  # of starting its embedded NATS server.

  # Cluster mode: set replicas > 1 to enable a NATS cluster with
  # automatic route discovery via headless service.
  replicas: 1

  # Token auth (shared with daemon and agents).
  # Set via --set nats.auth.token=<daemon-token> at deploy time.
  # Leave empty to disable auth (cluster-internal only).
  auth:
    enabled: false
    token: ""

  # JetStream (required for HOOK_EVENTS, DECISION_EVENTS streams)
  jetstream:
    maxMemory: 256M

  # Persistence for JetStream file store
  persistence:
    enabled: true
    storageClass: "gp2"
    size: 2Gi

  # Official NATS alpine image (tiny, no entrypoint issues)
  # Default to ECR mirror to avoid Docker Hub rate limits.
  image:
    registry: public.ecr.aws
    repository: docker/library/nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent

  # Cluster configuration (active when replicas > 1).
  # NATS nodes discover each other via DNS on the headless service.
  cluster:
    port: 6222

  # WebSocket listener for browser-based and external NATS clients.
  # Clients connect via wss://<host>/nats when ingress is enabled.
  websocket:
    enabled: false
    port: 8443

  # Ingress for external NATS access (WebSocket + monitoring).
  # Requires websocket.enabled=true for client connections.
  # Monitoring endpoints (/nats-monitor/connz, /nats-monitor/jsz, etc.)
  # are always available when ingress is enabled.
  ingress:
    enabled: false
    host: ""
    entryPoints:
      - web
      - websecure
    stripPrefix: true  # Strip /nats prefix before forwarding to NATS WS

  # Pod anti-affinity to spread NATS nodes across K8s nodes (cluster mode).
  affinity: {}

  # Pod Disruption Budget (cluster mode).
  pdb:
    enabled: false
    maxUnavailable: 1

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Monitoring (Prometheus ServiceMonitors + alerting rules) ---
monitoring:
  enabled: false
  scrapeInterval: "30s"

# --- Pod configuration ---
podAnnotations: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  readOnlyRootFilesystem: false  # daemon writes logs, metadata.json, pid file to .beads/
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# --- Agent toolchain sidecars ---
# Profiles referenced by agent pods via sidecar_profile metadata.
# The gastown agent controller reads these to inject init containers.
sidecarProfiles:
  toolchain-full:
    image:
      repository: ghcr.io/groblegark/gastown-toolchain
      tag: "latest"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "4Gi"
  toolchain-minimal:
    image:
      repository: ghcr.io/groblegark/gastown-toolchain
      tag: "minimal"
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# Default sidecar profile for agent pods (empty = no sidecar)
defaultSidecarProfile: ""

# Security constraints for custom sidecars
sidecarSecurity:
  registryAllowlist:
    - "ghcr.io/groblegark/"
  maxCPU: "2"
  maxMemory: "4Gi"
  maxChangesPerHour: 3

# Additional environment variables
extraEnv: []

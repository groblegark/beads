# OCI image builds for beads — RWX native (no Dockerfiles).
#
# Uses $RWX_IMAGE for image metadata instead of inline Dockerfiles.
# Images are pushed via `rwx image build --push-to` from the CLI.
#
# OPTIMIZATIONS:
# - Filter directives on Go/Rust builds (cached by lockfiles)
# - Parallel binary builds (Go + Rust)
# - RWX native layer caching replaces Docker BuildKit

on:
  github:
    push:
      if: ${{ event.git.branch == 'main' || starts-with(event.git.tag, 'v') }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
      status-checks:
        name: Image
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: pr
      status-checks:
        - tasks: [build-bd, build-oj]
          name: Image
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      ref-name: cli

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ── Resolve ref name (strip refs/tags/ and refs/heads/ prefixes) ───
  - key: resolve-ref
    run: |
      TAG="${REF_NAME#refs/tags/}"
      TAG="${TAG#refs/heads/}"
      echo -n "$TAG" > /tmp/resolved-tag
      echo "Resolved ref: $TAG"
    env:
      REF_NAME: ${{ init.ref-name }}
    outputs:
      artifacts:
        - key: resolved-tag
          path: /tmp/resolved-tag

  # ── System deps (cached until lock changes) ────────────────────────
  - key: system-deps
    filter:
      - .rwx/system-deps.lock
    run: |
      echo "Installing build dependencies (should be cached)..."
      sudo apt-get update
      sudo apt-get install -y libicu-dev gcc g++

  # ── Clone beads repo ────────────────────────────────────────────────
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}

  # ── Go toolchain (cached by version, see .go-version) ───────────────
  - key: go
    call: golang/install 1.2.0
    with:
      go-version: "1.25"
    filter:
      - .go-version

  # ── Go mod download (cached by lockfiles) ───────────────────────────
  - key: go-deps
    use: [code, go, system-deps]
    run: go mod download
    filter:
      - go.mod
      - go.sum

  # ── Build bd binary (only when Go code changes) ─────────────────────
  - key: build-bd
    use: [go-deps, resolve-ref]
    filter:
      - "*.go"
      - "cmd/bd/*.go"
      - "!cmd/bd/version.go"
      - "cmd/**/*.go"
      - "pkg/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/bd/templates/**"
    run: |
      echo "Building bd binary..."
      TAG=$(cat ${{ tasks.resolve-ref.artifacts.resolved-tag }})
      CGO_ENABLED=1 GOOS=linux go build \
        -ldflags="-s -w -X main.Version=${TAG} -X main.Build=${COMMIT_SHA}" \
        -o bd ./cmd/bd
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
    outputs:
      artifacts:
        - key: bd-binary
          path: bd

  # ── Rust toolchain (cached, rebuild monthly) ────────────────────────
  - key: rust
    filter:
      - .rwx/rust-version.lock
    run: |
      echo "Installing Rust toolchain (should be cached)..."
      curl -fsSL --proto '=https' --tlsv1.2 https://sh.rustup.rs \
        | sh -s -- -y --default-toolchain 1.93.0

  # ── Build oj binary (cached, rebuild on oddjobs updates) ────────────
  - key: build-oj
    use: rust
    filter:
      - .rwx/oj-version.lock
    run: |
      set -ex
      export PATH="$HOME/.cargo/bin:$PATH"

      if [ -f /tmp/oj-cache/oj ]; then
        echo "Using cached oj binary"
        cp /tmp/oj-cache/oj oj
      else
        echo "Building oj from source (cache miss)..."
        git clone --depth 1 --branch main https://github.com/groblegark/oddjobs.git /tmp/oj
        rm -f /tmp/oj/.cargo/config.toml
        cargo build --manifest-path /tmp/oj/Cargo.toml --release -p oj

        mkdir -p /tmp/oj-cache
        cp /tmp/oj/target/release/oj /tmp/oj-cache/oj
        cp /tmp/oj/target/release/oj oj
      fi
    outputs:
      artifacts:
        - key: oj-binary
          path: oj

  # ── Beads daemon image (RWX native) ─────────────────────────────────
  - key: image-bd
    use: [build-bd, build-oj]
    if: ${{ init.ref-name != 'pr' }}
    run: |
      # Install runtime deps
      sudo apt-get -y update
      sudo apt-get -y install --no-install-recommends \
        ca-certificates tzdata libicu74 netcat-openbsd
      sudo rm -rf /var/lib/apt/lists/*

      # Create /home/beads for UID 1000. The Helm chart's securityContext
      # forces runAsUser:1000/fsGroup:1000 regardless of username. RWX runs
      # as the ubuntu:1000 user so we can't rename it — just create the
      # directory and ensure ownership.
      sudo mkdir -p /home/beads
      sudo chown 1000:1000 /home/beads

      # Install binaries
      sudo cp ${{ tasks.build-bd.artifacts.bd-binary }} /usr/local/bin/bd
      sudo cp ${{ tasks.build-oj.artifacts.oj-binary }} /usr/local/bin/oj
      sudo chmod 755 /usr/local/bin/bd /usr/local/bin/oj
      sudo chown 1000:1000 /usr/local/bin/bd /usr/local/bin/oj

      # Configure image metadata (user by UID since we can't rename ubuntu→beads)
      jq -n '["bd"]' > $RWX_IMAGE/entrypoint.json
      jq -n '["daemon", "start", "--foreground", "--tcp-addr=:9876", "--http-addr=:9877", "--log-json"]' > $RWX_IMAGE/command.json
      echo "1000" > $RWX_IMAGE/user
      echo "/home/beads" > $RWX_IMAGE/workspace

  # ── Toolchain image (agent runtime with full dev tools) ─────────────
  - key: image-toolchain
    use: [build-bd, build-oj, go]
    if: ${{ init.ref-name != 'pr' }}
    filter:
      - .rwx/toolchain-version.lock
      - .go-version
    run: |
      export DEBIAN_FRONTEND=noninteractive

      # Runtime + build deps
      sudo apt-get -y update
      sudo apt-get -y install --no-install-recommends \
        ca-certificates tzdata libicu74 netcat-openbsd \
        git curl wget jq make gcc g++ libicu-dev \
        build-essential pkg-config libssl-dev
      sudo rm -rf /var/lib/apt/lists/*

      # Create agent user (don't modify running ubuntu user)
      sudo groupadd -g 1001 agent
      sudo useradd -u 1001 -g agent -s /bin/bash -m agent

      # Go — resolve version from the same golang/install used by build tasks
      GO_VERSION=$(go env GOVERSION | sed 's/^go//')
      echo "Installing Go ${GO_VERSION} into image..."
      curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -C /usr/local -xzf -

      # Rust (install as agent user)
      sudo -u agent bash -c 'curl -fsSL --proto "=https" --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0'

      # Node.js
      curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
      sudo apt-get -y install --no-install-recommends nodejs
      sudo rm -rf /var/lib/apt/lists/*

      # Install binaries
      sudo cp ${{ tasks.build-bd.artifacts.bd-binary }} /usr/local/bin/bd
      sudo cp ${{ tasks.build-oj.artifacts.oj-binary }} /usr/local/bin/oj
      sudo chmod 755 /usr/local/bin/bd /usr/local/bin/oj

      # Configure image metadata
      echo "agent" > $RWX_IMAGE/user
      echo "/home/agent" > $RWX_IMAGE/workspace

  # ── Push daemon image to GHCR ─────────────────────────────────────
  - key: push-bd
    use: [build-bd, build-oj, resolve-ref]
    if: ${{ init.ref-name != 'pr' }}
    cache: false
    run: |
      # Install runtime deps (same as image-bd task) — the binary needs
      # libicu74 at runtime because it's built with CGO_ENABLED=1.
      sudo apt-get -y update
      sudo apt-get -y install --no-install-recommends \
        ca-certificates tzdata libicu74 netcat-openbsd
      sudo rm -rf /var/lib/apt/lists/*

      # Install crane
      curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
        | tar xz -C /tmp crane
      sudo mv /tmp/crane /usr/local/bin/

      # Login to GHCR
      echo "$GHCR_TOKEN" | crane auth login ghcr.io -u "$GITHUB_USER" --password-stdin

      TAG=$(cat ${{ tasks.resolve-ref.artifacts.resolved-tag }})

      # Create layer with runtime deps + binaries
      mkdir -p /tmp/layer/usr/local/bin /tmp/layer/home/beads
      cp ${{ tasks.build-bd.artifacts.bd-binary }} /tmp/layer/usr/local/bin/bd
      cp ${{ tasks.build-oj.artifacts.oj-binary }} /tmp/layer/usr/local/bin/oj
      chmod 755 /tmp/layer/usr/local/bin/*

      # Copy CA certificates into the layer.
      # The base ubuntu:24.04 image doesn't include ca-certificates,
      # which breaks TLS for any outbound HTTPS (e.g., slackbot → slack.com).
      mkdir -p /tmp/layer/etc/ssl/certs
      cp /etc/ssl/certs/ca-certificates.crt /tmp/layer/etc/ssl/certs/

      # Copy libicu74 shared libraries into the layer.
      # The bd binary is CGO-linked and needs libicu at runtime.
      # Ubuntu 24.04 base has all other required libs, just not ICU.
      ICU_LIBS=$(dpkg -L libicu74 | grep '\.so')
      if [ -z "$ICU_LIBS" ]; then
        echo "ERROR: no libicu74 shared libraries found"
        exit 1
      fi
      echo "$ICU_LIBS" | while read -r lib; do
        dir="/tmp/layer$(dirname "$lib")"
        mkdir -p "$dir"
        cp -a "$lib" "$dir/"
      done

      tar -cf /tmp/layer.tar -C /tmp/layer .

      # Push with tag and latest
      REPO="ghcr.io/groblegark/beads"
      crane append --base ubuntu:24.04 --new_tag "${REPO}:${TAG}" --new_layer /tmp/layer.tar --platform linux/amd64
      crane tag "${REPO}:${TAG}" latest
      echo "Pushed ${REPO}:${TAG} and ${REPO}:latest"
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITHUB_USER: ${{ secrets.GITHUB_USER }}

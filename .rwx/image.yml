# OCI image builds for beads — RWX native (no Dockerfiles).
#
# Uses $RWX_IMAGE for image metadata instead of inline Dockerfiles.
# Images are pushed via `rwx image build --push-to` from the CLI.
#
# OPTIMIZATIONS:
# - Filter directives on Go/Rust builds (cached by lockfiles)
# - Parallel binary builds (Go + Rust)
# - RWX native layer caching replaces Docker BuildKit

on:
  github:
    push:
      if: ${{ event.git.branch == 'main' || starts-with(event.git.tag, 'v') }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
      status-checks:
        name: Image
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: pr
      status-checks:
        - tasks: [build-bd, build-oj]
          name: Image
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      ref-name: cli

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ── System deps (cached until lock changes) ────────────────────────
  - key: build-deps
    filter:
      - .rwx/build-deps.lock
    run: |
      echo "Installing build dependencies (should be cached)..."
      sudo apt-get update
      sudo apt-get install -y libicu-dev gcc g++

  # ── Clone beads repo ────────────────────────────────────────────────
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}

  # ── Go toolchain (cached by version) ────────────────────────────────
  - key: go
    call: golang/install 1.2.0
    with:
      go-version: "1.25"
    filter:
      - .go-version

  # ── Go mod download (cached by lockfiles) ───────────────────────────
  - key: go-deps
    use: [code, go, build-deps]
    run: go mod download
    filter:
      - go.mod
      - go.sum

  # ── Build bd binary (only when Go code changes) ─────────────────────
  - key: build-bd
    use: go-deps
    filter:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/bd/templates/**"
    run: |
      echo "Building bd binary..."
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"
      CGO_ENABLED=1 GOOS=linux go build \
        -ldflags="-s -w -X main.Version=${REF_NAME} -X main.Build=${COMMIT_SHA}" \
        -o bd ./cmd/bd
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
      REF_NAME: ${{ init.ref-name }}
    outputs:
      artifacts:
        - key: bd-binary
          path: bd

  # ── Rust toolchain (cached, rebuild monthly) ────────────────────────
  - key: rust
    filter:
      - .rwx/rust-version.lock
    run: |
      echo "Installing Rust toolchain (should be cached)..."
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --default-toolchain 1.93.0

  # ── Build oj binary (cached, rebuild on oddjobs updates) ────────────
  - key: build-oj
    use: rust
    filter:
      - .rwx/oj-version.lock
    run: |
      set -ex
      export PATH="$HOME/.cargo/bin:$PATH"

      if [ -f /tmp/oj-cache/oj ]; then
        echo "Using cached oj binary"
        cp /tmp/oj-cache/oj oj
      else
        echo "Building oj from source (cache miss)..."
        git clone --depth 1 --branch main https://github.com/groblegark/oddjobs.git /tmp/oj
        rm -f /tmp/oj/.cargo/config.toml
        cargo build --manifest-path /tmp/oj/Cargo.toml --release -p oj

        mkdir -p /tmp/oj-cache
        cp /tmp/oj/target/release/oj /tmp/oj-cache/oj
        cp /tmp/oj/target/release/oj oj
      fi
    outputs:
      artifacts:
        - key: oj-binary
          path: oj

  # ── Beads daemon image (RWX native) ─────────────────────────────────
  - key: image-bd
    use: [build-bd, build-oj]
    if: ${{ init.ref-name != 'pr' }}
    run: |
      # Install runtime deps
      sudo apt-get -y update
      sudo apt-get -y install --no-install-recommends \
        ca-certificates tzdata libicu74 netcat-openbsd
      sudo rm -rf /var/lib/apt/lists/*

      # Create beads user (don't modify running ubuntu user)
      sudo groupadd -g 1001 beads
      sudo useradd -u 1001 -g beads -s /bin/sh -m beads

      # Install binaries
      sudo cp ${{ tasks.build-bd.artifacts.bd-binary }} /usr/local/bin/bd
      sudo cp ${{ tasks.build-oj.artifacts.oj-binary }} /usr/local/bin/oj
      sudo chmod 755 /usr/local/bin/bd /usr/local/bin/oj
      sudo chown beads:beads /usr/local/bin/bd /usr/local/bin/oj

      # Configure image metadata
      jq -n '["bd"]' > $RWX_IMAGE/entrypoint.json
      jq -n '["daemon", "start", "--foreground", "--tcp-addr=:9876", "--http-addr=:9877", "--log-json"]' > $RWX_IMAGE/command.json
      echo "beads" > $RWX_IMAGE/user
      echo "/home/beads" > $RWX_IMAGE/workspace

  # ── Toolchain image (agent runtime with full dev tools) ─────────────
  - key: image-toolchain
    use: [build-bd, build-oj]
    if: ${{ init.ref-name != 'pr' }}
    filter:
      - .rwx/toolchain-version.lock
    run: |
      export DEBIAN_FRONTEND=noninteractive

      # Runtime + build deps
      sudo apt-get -y update
      sudo apt-get -y install --no-install-recommends \
        ca-certificates tzdata libicu74 netcat-openbsd \
        git curl wget jq make gcc g++ libicu-dev \
        build-essential pkg-config libssl-dev
      sudo rm -rf /var/lib/apt/lists/*

      # Create agent user (don't modify running ubuntu user)
      sudo groupadd -g 1001 agent
      sudo useradd -u 1001 -g agent -s /bin/bash -m agent

      # Go
      curl -fsSL "https://go.dev/dl/go1.25.linux-amd64.tar.gz" | sudo tar -C /usr/local -xzf -

      # Rust (install as agent user)
      sudo -u agent bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0'

      # Node.js
      curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
      sudo apt-get -y install --no-install-recommends nodejs
      sudo rm -rf /var/lib/apt/lists/*

      # Install binaries
      sudo cp ${{ tasks.build-bd.artifacts.bd-binary }} /usr/local/bin/bd
      sudo cp ${{ tasks.build-oj.artifacts.oj-binary }} /usr/local/bin/oj
      sudo chmod 755 /usr/local/bin/bd /usr/local/bin/oj

      # Configure image metadata
      echo "agent" > $RWX_IMAGE/user
      echo "/home/agent" > $RWX_IMAGE/workspace

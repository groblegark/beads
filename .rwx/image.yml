# Optimized OCI image build with aggressive caching
# Rust builds are expensive - cache them for 7 days via filter
on:
  github:
    push:
      if: ${{ event.git.branch == 'main' || starts-with(event.git.tag, 'v') }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
      status-checks:
        name: Image
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: pr
      status-checks:
        - tasks: [build-bd, build-oj]
          name: Image
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      ref-name: cli

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ── System deps (cached until lock changes) ────────────────────────
  - key: build-deps
    filter:
      - .rwx/build-deps.lock  # Touch weekly to rebuild
    run: |
      echo "Installing build dependencies (should be cached)..."
      sudo apt-get update
      sudo apt-get install -y libicu-dev gcc g++

  # ── Clone beads repo ────────────────────────────────────────────────
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}

  # ── Go toolchain (cached by version) ────────────────────────────────
  - key: go
    call: golang/install 1.2.0
    with:
      go-version: "1.25"
    filter:
      - .go-version  # Only reinstall if Go version changes

  # ── Go mod download (cached by lockfiles) ───────────────────────────
  - key: go-deps
    use: [code, go, build-deps]
    run: go mod download
    filter:
      - go.mod
      - go.sum

  # ── Build bd binary (only when Go code changes) ─────────────────────
  - key: build-bd
    use: go-deps
    filter:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    run: |
      echo "Building bd binary..."
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"
      CGO_ENABLED=1 GOOS=linux go build \
        -ldflags="-s -w -X main.Version=${REF_NAME} -X main.Build=${COMMIT_SHA}" \
        -o bd ./cmd/bd
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
      REF_NAME: ${{ init.ref-name }}
    outputs:
      artifacts:
        - key: bd-binary
          path: bd

  # ── Rust toolchain (cached, rebuild monthly) ────────────────────────
  - key: rust
    filter:
      - .rwx/rust-version.lock  # Touch monthly to update Rust
    run: |
      echo "Installing Rust toolchain (should be cached)..."
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --default-toolchain 1.93.0

  # ── Build oj binary (cached, rebuild on oddjobs updates) ────────────
  - key: build-oj
    use: rust
    filter:
      - .rwx/oj-version.lock  # Touch when oddjobs updates needed
    run: |
      set -ex
      export PATH="$HOME/.cargo/bin:$PATH"

      # Check if we have a cached binary
      if [ -f /tmp/oj-cache/oj ]; then
        echo "Using cached oj binary"
        cp /tmp/oj-cache/oj oj
      else
        echo "Building oj from source (cache miss)..."
        git clone --depth 1 --branch main https://github.com/groblegark/oddjobs.git /tmp/oj
        rm -f /tmp/oj/.cargo/config.toml
        cargo build --manifest-path /tmp/oj/Cargo.toml --release -p oj

        # Cache the binary
        mkdir -p /tmp/oj-cache
        cp /tmp/oj/target/release/oj /tmp/oj-cache/oj
        cp /tmp/oj/target/release/oj oj
      fi
    outputs:
      artifacts:
        - key: oj-binary
          path: oj

  # ── Docker image push (uses BuildKit cache) ─────────────────────────
  - key: push
    use: [build-bd, build-oj]
    if: ${{ init.ref-name != 'pr' }}
    docker: true
    run: |
      # Normalize ref
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"

      # Setup BuildKit for layer caching
      export DOCKER_BUILDKIT=1

      # Build context
      mkdir -p /tmp/image-ctx
      cp ${{ tasks.build-bd.artifacts.bd-binary }} /tmp/image-ctx/bd
      cp ${{ tasks.build-oj.artifacts.oj-binary }} /tmp/image-ctx/oj

      # Optimized Dockerfile with cache mount points
      cat > /tmp/image-ctx/Dockerfile << 'EOF'
FROM ubuntu:24.04
# Install runtime deps in one layer (cached)
RUN --mount=type=cache,target=/var/cache/apt \
    apt-get update && apt-get install -y --no-install-recommends \
        ca-certificates tzdata libicu74 netcat-openbsd \
    && rm -rf /var/lib/apt/lists/* \
    && userdel -r ubuntu 2>/dev/null; groupdel ubuntu 2>/dev/null; true \
    && groupadd -g 1000 beads \
    && useradd -u 1000 -g beads -s /bin/sh -m beads
COPY bd oj /usr/local/bin/
RUN chmod 755 /usr/local/bin/bd /usr/local/bin/oj \
    && chown beads:beads /usr/local/bin/bd /usr/local/bin/oj
USER beads
WORKDIR /home/beads
EXPOSE 9876 9877
HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \
    CMD nc -z localhost 9877 || exit 1
ENTRYPOINT ["bd"]
CMD ["daemon", "start", "--foreground", "--tcp-addr=:9876", "--http-addr=:9877", "--log-json"]
EOF

      SHORT_SHA="${COMMIT_SHA:0:7}"

      # Build with cache-from for layer reuse
      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

      docker build \
        --cache-from ghcr.io/groblegark/beads:latest \
        -t ghcr.io/groblegark/beads:sha-${SHORT_SHA} \
        -t ghcr.io/groblegark/beads:latest \
        /tmp/image-ctx

      # Smoke test
      docker run --rm ghcr.io/groblegark/beads:sha-${SHORT_SHA} version

      # Push
      docker push ghcr.io/groblegark/beads:sha-${SHORT_SHA}
      docker push ghcr.io/groblegark/beads:latest

      # Version tag on release
      if [[ "$REF_NAME" == v* ]]; then
        VERSION="${REF_NAME#v}"
        docker tag ghcr.io/groblegark/beads:sha-${SHORT_SHA} ghcr.io/groblegark/beads:${VERSION}
        docker push ghcr.io/groblegark/beads:${VERSION}
      fi
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
      REF_NAME: ${{ init.ref-name }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITHUB_USER: ${{ secrets.GITHUB_USER }}
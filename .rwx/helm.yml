# Helm chart lint — validates chart templates and dependencies.
#
# Chart publishing is handled by gastown docker.yml (helm-publish-charts task)
# with CalVer versioning from platform-versions.env. This workflow is lint-only.
#
# Lint manually: rwx run .rwx/helm.yml --init commit-sha=$(git rev-parse HEAD) --wait
on:
  github:
    push:
      if: ${{ starts-with(event.git.tag, 'v') }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
      status-checks:
        name: Helm
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      ref-name: cli

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}

  # ── Helm installation (cached until version changes) ────────────────
  - key: helm-setup
    filter:
      - .rwx/helm-version.lock  # Touch to update Helm version
    run: |
      echo "Installing Helm (should be cached)..."
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  # ── GHCR login (needed to pull bd-daemon subchart dependencies) ─────
  - key: helm-login
    use: helm-setup
    cache: false
    run: |
      echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_USER" --password-stdin
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITHUB_USER: ${{ secrets.GITHUB_USER }}

  # ── Helm lint (only when charts change) ─────────────────────────────
  - key: helm-lint
    use: [code, helm-login]
    filter:
      - "helm/**"
    run: |
      for chart in helm/*/; do
        if [ -f "$chart/Chart.yaml" ]; then
          echo "=== Linting $chart ==="
          # Build deps (bd-daemon chart depends on redis from Bitnami).
          # Let real errors fail loudly; only suppress expected warnings on stderr.
          helm dependency build "$chart" 2> >(grep -v '^Warning:' >&2)
          helm lint "$chart"
          helm template "$(basename $chart)" "$chart" > /dev/null
        fi
      done

  # NOTE: Chart publishing is handled by gastown docker.yml (helm-publish-charts).
  # All deployed charts use CalVer versioning from platform-versions.env.

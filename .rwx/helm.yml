# Helm chart CI/CD — auto-publishes on v* tags, manual lint via CLI.
# Lint manually: rwx run .rwx/helm.yml --init commit-sha=$(git rev-parse HEAD) --wait
on:
  github:
    push:
      if: ${{ starts-with(event.git.tag, 'v') }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
      status-checks:
        name: Helm
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      ref-name: cli

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}

  # ── Helm installation (cached until version changes) ────────────────
  - key: helm-setup
    filter:
      - .rwx/helm-version.lock  # Touch to update Helm version
    run: |
      echo "Installing Helm (should be cached)..."
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  # ── Helm lint (only when charts change) ─────────────────────────────
  - key: helm-lint
    use: [code, helm-setup]
    filter:
      - "helm/**"
    run: |
      for chart in helm/*/; do
        if [ -f "$chart/Chart.yaml" ]; then
          echo "=== Linting $chart ==="
          helm dependency build "$chart" 2>/dev/null || true
          helm lint "$chart"
          helm template "$(basename $chart)" "$chart" > /dev/null
        fi
      done

  # ── Helm publish (only when charts change & not PR) ─────────────────
  - key: helm-publish
    use: helm-lint
    if: ${{ init.ref-name != 'pr' }}
    filter:
      - "helm/**"
    run: |
      echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_USER" --password-stdin

      # Check if charts actually changed
      CHANGED=false
      for chart in helm/*/; do
        if [ -f "$chart/Chart.yaml" ]; then
          name=$(basename "$chart")
          version=$(grep '^version:' "$chart/Chart.yaml" | awk '{print $2}')

          # Check if this version already exists in registry
          if helm pull "oci://ghcr.io/groblegark/charts/${name}" --version "${version}" 2>/dev/null; then
            echo "Chart ${name} v${version} already exists, skipping..."
          else
            echo "Publishing ${name} v${version}..."
            helm dependency build "$chart" 2>/dev/null || true
            helm package "$chart" --destination /tmp/helm-packages
            helm push "/tmp/helm-packages/${name}-${version}.tgz" "oci://ghcr.io/groblegark/charts"
            echo "Published: oci://ghcr.io/groblegark/charts/${name}:${version}"
            CHANGED=true
          fi
        fi
      done

      if [ "$CHANGED" = "false" ]; then
        echo "No chart changes to publish"
      fi
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITHUB_USER: ${{ secrets.GITHUB_USER }}
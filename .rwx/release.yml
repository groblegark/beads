# Optimized release workflow with caching
on:
  github:
    push:
      if: ${{ starts-with(event.git.tag, '20') }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      ref-name: dev

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ── System deps (cached until lock changes) ─────────────────────────
  - key: system-deps
    filter:
      - .rwx/release-deps.lock  # Touch monthly to update
    run: |
      echo "Installing release dependencies (should be cached)..."
      sudo apt-get update
      sudo apt-get install -y libicu-dev gcc g++

  # ── Full clone with history (required for GoReleaser) ───────────────
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}
      fetch-full-depth: true  # Full history needed for GoReleaser changelog
      preserve-git-dir: true  # GoReleaser needs .git to detect tags/changelog

  # ── Go toolchain (cached by version, see .go-version) ───────────────
  - key: go
    call: golang/install 1.2.0
    with:
      go-version: "1.25"
    filter:
      - .go-version

  # ── GoReleaser (cached by version) ──────────────────────────────────
  - key: goreleaser
    use: go
    filter:
      - .rwx/goreleaser-version.lock  # Touch to update version
    run: |
      echo "Installing GoReleaser (should be cached)..."
      mkdir -p $(go env GOPATH)/bin
      curl -fsSL "https://github.com/goreleaser/goreleaser/releases/download/v2.8.2/goreleaser_Linux_x86_64.tar.gz" \
        | tar -xz -C $(go env GOPATH)/bin goreleaser

  # ── Zig cross-compiler for darwin builds (cached by version) ───────
  - key: zig
    filter:
      - .rwx/zig-version.lock  # Touch to update zig version
    run: |
      echo "Installing Zig 0.14.0 for cross-compilation..."
      curl -fsSL "https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz" \
        | tar -xJ -C /tmp
      sudo ln -sf /tmp/zig-linux-x86_64-0.14.0/zig /usr/local/bin/zig
      zig version

      # Create zig CC wrapper scripts for darwin cross-compilation.
      # The wrappers strip -lresolv, -framework CoreFoundation, and
      # -framework Security from link commands — zig 0.14.0 can't
      # find these macOS system libs. Go's runtime resolves them via
      # dyld lazy binding at runtime instead.
      # flock serializes zig calls per target to prevent AccessDenied races.
      mkdir -p /tmp/zigcc
      for pair in \
        "cc-x86_64-macos:x86_64-macos" \
        "cc-aarch64-macos:aarch64-macos"; do
        name="${pair%%:*}"
        target="${pair##*:}"
        cat > "/tmp/zigcc/$name" << 'WRAPPER'
      #!/bin/sh
      # Filter out macOS system libs that zig can't resolve.
      # Go's runtime handles these via dyld lazy binding.
      args=""
      skip_next=false
      for arg in "$@"; do
        if $skip_next; then
          skip_next=false
          continue
        fi
        case "$arg" in
          -lresolv|-lpthread) continue ;;
          -framework)
            skip_next=true
            continue ;;
        esac
        args="$args $arg"
      done
      exec flock /tmp/zigcc/lock-TARGET zig cc -target TARGET $args
      WRAPPER
        sed -i "s/TARGET/$target/g" "/tmp/zigcc/$name"
        chmod +x "/tmp/zigcc/$name"
      done
      echo "Zig wrappers created: $(ls /tmp/zigcc/cc-*)"

  # ── Go deps (cached by lockfiles) ───────────────────────────────────
  - key: go-deps
    use: [code, go, system-deps]
    filter:
      - go.mod
      - go.sum
    run: go mod download

  # ── Run GoReleaser ──────────────────────────────────────────────────
  - key: release
    use: [go-deps, goreleaser, zig]
    cache: false
    run: |
      TAG="${REF_NAME#refs/tags/}"
      TAG="${TAG#refs/heads/}"

      # Configure git for GoReleaser
      git config --global user.name "CI Bot"
      git config --global user.email "ci@beads.test"

      # Fetch tags — git/clone may not include them, and GoReleaser needs them
      git fetch --tags origin 2>/dev/null || true

      if [[ "$TAG" == "dev" ]]; then
        echo "Running snapshot release for dev..."
        goreleaser release --clean --snapshot --parallelism 1 --config .goreleaser.fork.yml
      else
        echo "Running full release for $TAG..."
        goreleaser release --clean --parallelism 1 --config .goreleaser.fork.yml
      fi
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      REF_NAME: ${{ init.ref-name }}

  # ── Dispatch to gastown (only for real releases) ────────────────────
  - key: dispatch-gastown
    use: release
    if: ${{ init.ref-name != 'dev' }}
    run: |
      TAG="${REF_NAME#refs/tags/}"
      TAG="${TAG#refs/heads/}"

      # Only dispatch if this is a CalVer tag (YYYY.MDD.N — no leading zero in month)
      if [[ "$TAG" =~ ^20[0-9]{2}\.[0-9]{3,4}\.[0-9]+$ ]]; then
        echo "Dispatching to gastown for rebuild (CalVer: $TAG)..."
        curl -fsSL -X POST https://api.rwx.com/v1/dispatches \
          -H "Authorization: Bearer $RWX_ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"repository\": \"gastown\",
            \"workflow\": \"gastown-agent-rebuild\",
            \"parameters\": {
              \"trigger-source\": \"beads-release-$TAG\",
              \"beads-version\": \"$TAG\"
            }
          }"
      else
        echo "Not a CalVer tag ($TAG), skipping gastown dispatch"
      fi
    env:
      RWX_ACCESS_TOKEN: ${{ secrets.RWX_ACCESS_TOKEN }}
      REF_NAME: ${{ init.ref-name }}

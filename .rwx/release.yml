# Optimized release workflow with caching
on:
  github:
    push:
      if: ${{ starts-with(event.git.tag, 'v') }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      ref-name: dev

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ── System deps (cached until lock changes) ─────────────────────────
  - key: system-deps
    filter:
      - .rwx/release-deps.lock  # Touch monthly to update
    run: |
      echo "Installing release dependencies (should be cached)..."
      sudo apt-get update
      sudo apt-get install -y libicu-dev gcc g++

  # ── Full clone with history (required for GoReleaser) ───────────────
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}
      fetch-full-depth: true  # Full history needed for GoReleaser changelog
      preserve-git-dir: true  # GoReleaser needs .git to detect tags/changelog

  # ── Go toolchain (cached by version) ────────────────────────────────
  - key: go
    call: golang/install 1.2.0
    with:
      go-version: "1.25"
    filter:
      - .go-version

  # ── GoReleaser (cached by version) ──────────────────────────────────
  - key: goreleaser
    use: go
    filter:
      - .rwx/goreleaser-version.lock  # Touch to update version
    run: |
      echo "Installing GoReleaser (should be cached)..."
      mkdir -p $(go env GOPATH)/bin
      curl -fsSL "https://github.com/goreleaser/goreleaser/releases/download/v2.8.2/goreleaser_Linux_x86_64.tar.gz" \
        | tar -xz -C $(go env GOPATH)/bin goreleaser

  # ── Go deps (cached by lockfiles) ───────────────────────────────────
  - key: go-deps
    use: [code, go, system-deps]
    filter:
      - go.mod
      - go.sum
    run: go mod download

  # ── Run GoReleaser ──────────────────────────────────────────────────
  - key: release
    use: [go-deps, goreleaser]
    cache: false
    run: |
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"

      # Configure git for GoReleaser
      git config --global user.name "CI Bot"
      git config --global user.email "ci@beads.test"

      if [[ "$REF_NAME" == "dev" ]]; then
        echo "Running snapshot release for dev..."
        goreleaser release --clean --snapshot --config .goreleaser.fork.yml
      else
        echo "Running full release for $REF_NAME..."
        goreleaser release --clean --config .goreleaser.fork.yml
      fi
    env:
      REF_NAME: ${{ init.ref-name }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ── Dispatch to gastown (only for real releases) ────────────────────
  - key: dispatch-gastown
    use: release
    if: ${{ init.ref-name != 'dev' }}
    run: |
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"

      # Only dispatch if this is a version tag
      if [[ "$REF_NAME" == v* ]]; then
        echo "Dispatching to gastown for rebuild..."
        curl -X POST https://api.rwx.com/v1/dispatches \
          -H "Authorization: Bearer $RWX_ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"repository\": \"gastown\",
            \"workflow\": \"gastown-agent-rebuild\",
            \"parameters\": {
              \"trigger\": \"beads-release-$REF_NAME\"
            }
          }"
      else
        echo "Not a version tag, skipping gastown dispatch"
      fi
    env:
      REF_NAME: ${{ init.ref-name }}
      RWX_ACCESS_TOKEN: ${{ secrets.RWX_ACCESS_TOKEN }}
# CI — manual only (no auto-trigger on push/PR).
# Run manually: rwx run .rwx/ci.yml --init commit-sha=$(git rev-parse HEAD) --wait
on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      trigger: cli

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ── System deps (heavily cached via filter) ────────────────────────────
  - key: system-deps
    filter:
      - .rwx/system-deps.lock  # Only rebuild when lock file changes
    run: |
      echo "Installing system dependencies (should be cached)..."
      sudo apt-get update
      sudo apt-get install -y libicu-dev gcc g++

  # ── Clone ────────────────────────────────────────────────────────────────
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}

  # ── Go toolchain (cached by version, see .go-version) ───────────────────
  - key: go
    call: golang/install 1.2.0
    with:
      go-version: "1.25"
    filter:
      - .go-version

  # ── golangci-lint (cached with fix) ─────────────────────────────────────
  - key: golangci-lint
    use: go
    filter:
      - .rwx/ci.yml
      - .golangci.yml
    run: |
      mkdir -p $(go env GOPATH)/bin
      curl -fsSL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
        | sh -s -- -b $(go env GOPATH)/bin v2.9.0

  # ── Download modules (cached by lockfiles) ──────────────────────────────
  - key: go-deps
    use: [code, go, system-deps]
    run: go mod download
    filter:
      - go.mod
      - go.sum

  # ── Git config (minimal, cached) ────────────────────────────────────────
  - key: git-config
    use: go-deps
    filter:
      - .rwx/ci.yml
    run: |
      git config --global user.name "CI Bot"
      git config --global user.email "ci@beads.test"

  # ── Build (only when source changes) ────────────────────────────────────
  - key: build
    use: [code, go-deps, git-config]
    filter:
      # List specific directories to avoid version.go cache invalidation
      - "*.go"               # Root package files (beads.go) needed for self-imports
      - "cmd/bd/*.go"
      - "!cmd/bd/version.go"  # Explicitly exclude version file
      - "cmd/**/*.go"
      - "pkg/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/bd/templates/**"
    run: |
      echo "Building (cache miss if code changed)..."
      time go build -v ./cmd/bd

  # ── Lint (parallel with build) ──────────────────────────────────────────
  - key: lint
    use: [code, git-config, golangci-lint, go-deps]
    filter:
      - "**/*.go"
      - "**/*.sql"                       # Embedded files referenced by //go:embed
      - "cmd/bd/templates/**"            # go:embed targets for hooks
      - "examples/monitor-webui/web/**"  # go:embed targets for webui
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
    run: golangci-lint run --timeout=5m

  # ── Fast tests (parallel execution, no race for speed) ─────────────────
  - key: test
    use: build
    filter:
      - "**/*.go"
      - "**/*_test.go"
      - "go.mod"
      - "go.sum"
      - "cmd/bd/templates/**"     # go:embed targets for hooks
      - "**/*.sql"                # go:embed targets for examples
      - "examples/monitor-webui/web/**"  # go:embed targets for webui
    run: |
      echo "Running tests with parallel execution..."
      go test -v -short -parallel 8 -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt

      # Check coverage (integer comparison — truncates decimal)
      # Use tail -1 to get only the final "total:" line (grep may match functions containing "total")
      COVERAGE=$(go tool cover -func=coverage.out | grep total | tail -1 | awk '{print $3}' | sed 's/%//')
      COVERAGE_INT=${COVERAGE%%.*}
      MIN_COVERAGE=25
      echo "Coverage: $COVERAGE%"
      if [ "$COVERAGE_INT" -lt "$MIN_COVERAGE" ]; then
        echo "Coverage below ${MIN_COVERAGE}% threshold"
        exit 1
      fi
    outputs:
      artifacts:
        - key: coverage
          path: coverage.out

  # ── Dolt benchmarks (manual, for perf baseline/regression) ──────────────
  - key: bench
    use: build
    cache: false
    filter:
      - "internal/storage/dolt/**"
      - "go.mod"
      - "go.sum"
    run: |
      echo "Running Dolt storage benchmarks..."
      echo "=== System Info ==="
      echo "CPU: $(nproc) cores"
      cat /proc/cpuinfo | grep "model name" | head -1
      echo "RAM: $(free -h | awk '/^Mem:/{print $2}')"
      echo "Go: $(go version)"
      echo "Dolt: $(dolt version 2>/dev/null || echo 'not installed')"
      echo ""

      # Install dolt for benchmarks that need it
      sudo bash -c 'curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | bash' || true
      dolt version || true

      # Run all benchmarks with 3 iterations for stable numbers
      echo "=== Benchmark Run (count=3) ==="
      go test -bench=. -benchmem -benchtime=3s -count=3 -timeout=600s \
        ./internal/storage/dolt/... 2>&1 | tee bench-raw.txt

      # Also produce benchstat-compatible output
      grep -E "^(Benchmark|ok|FAIL)" bench-raw.txt > bench-results.txt || true

      echo ""
      echo "=== Summary ==="
      echo "Total benchmarks: $(grep -c '^Benchmark' bench-results.txt || echo 0)"
      wc -l bench-results.txt
    outputs:
      artifacts:
        - key: bench-raw
          path: bench-raw.txt
        - key: bench-results
          path: bench-results.txt

  # ── Version check ────────────────────────────────────────────────────────
  - key: version-check
    use: code
    filter:
      - cmd/bd/version.go
      - integrations/beads-mcp/pyproject.toml
      - integrations/beads-mcp/src/beads_mcp/__init__.py
      - claude-plugin/.claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - npm-package/package.json
      - cmd/bd/templates/hooks/prepare-commit-msg
      - scripts/check-versions.sh
    run: ./scripts/check-versions.sh

  # ── Beads JSONL guard (PRs only — comparing to main is meaningless on main) ─
  - key: beads-changes-check
    use: code
    if: ${{ init.trigger == 'pr' }}
    run: |
      git fetch origin main --depth=1 2>/dev/null || true
      if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q "^\.beads/issues\.jsonl$"; then
        echo "ERROR: .beads/issues.jsonl modified"
        exit 1
      fi
      echo "No .beads/issues.jsonl changes"
# Optimized CI with performance improvements
on:
  github:
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
      status-checks:
        name: CI
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
      status-checks:
        - tasks: [build, lint, test, version-check]
          name: CI
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ── System deps (heavily cached via filter) ────────────────────────────
  - key: system-deps
    filter:
      - .rwx/system-deps.lock  # Only rebuild when lock file changes
    run: |
      echo "Installing system dependencies (should be cached)..."
      sudo apt-get update
      sudo apt-get install -y libicu-dev gcc g++ bc

  # ── Clone ────────────────────────────────────────────────────────────────
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/groblegark/beads.git
      ref: ${{ init.commit-sha }}

  # ── Go toolchain (cached by version) ────────────────────────────────────
  - key: go
    call: golang/install 1.2.0
    with:
      go-version: "1.25"
    filter:
      - .go-version  # Only reinstall if Go version changes

  # ── golangci-lint (cached with fix) ─────────────────────────────────────
  - key: golangci-lint
    use: go
    filter:
      - .rwx/ci.yml
      - .golangci.yml
    run: |
      mkdir -p $(go env GOPATH)/bin
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
        | sh -s -- -b $(go env GOPATH)/bin v2.9.0

  # ── Download modules (cached by lockfiles) ──────────────────────────────
  - key: go-deps
    use: [code, go, system-deps]
    run: go mod download
    filter:
      - go.mod
      - go.sum

  # ── Git config (minimal, cached) ────────────────────────────────────────
  - key: git-config
    use: go-deps
    filter:
      - .rwx/ci.yml
    run: |
      git config --global user.name "CI Bot"
      git config --global user.email "ci@beads.test"

  # ── Build (only when source changes) ────────────────────────────────────
  - key: build
    use: git-config
    filter:
      # List specific directories to avoid version.go cache invalidation
      - "*.go"               # Root package files (beads.go) needed for self-imports
      - "cmd/bd/*.go"
      - "!cmd/bd/version.go"  # Explicitly exclude version file
      - "cmd/**/*.go"
      - "pkg/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "cmd/bd/templates/**"
    run: |
      echo "Building (cache miss if code changed)..."
      time go build -v ./cmd/bd

  # ── Lint (parallel with build) ──────────────────────────────────────────
  - key: lint
    use: [git-config, golangci-lint, go-deps]
    filter:
      - "**/*.go"
      - "**/*.sql"                       # Embedded files referenced by //go:embed
      - "cmd/bd/templates/**"            # go:embed targets for hooks
      - "examples/monitor-webui/web/**"  # go:embed targets for webui
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
    run: golangci-lint run --timeout=5m

  # ── Fast tests (parallel execution, no race for speed) ─────────────────
  - key: test
    use: build
    filter:
      - "**/*.go"
      - "**/*_test.go"
      - "go.mod"
      - "go.sum"
      - "cmd/bd/templates/**"     # go:embed targets for hooks
      - "**/*.sql"                # go:embed targets for examples
      - "examples/monitor-webui/web/**"  # go:embed targets for webui
    run: |
      echo "Running tests with parallel execution..."
      go test -v -short -parallel 8 -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt

      # Check coverage
      COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
      MIN_COVERAGE=42
      echo "Coverage: $COVERAGE%"
      if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
        echo "Coverage below ${MIN_COVERAGE}% threshold"
        exit 1
      fi

  # ── Version check ────────────────────────────────────────────────────────
  - key: version-check
    use: code
    run: ./scripts/check-versions.sh

  # ── Beads JSONL guard ────────────────────────────────────────────────────
  - key: beads-changes-check
    use: code
    run: |
      git fetch origin main --depth=1 2>/dev/null || true
      if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q "^\.beads/issues\.jsonl$"; then
        echo "ERROR: .beads/issues.jsonl modified"
        exit 1
      fi
      echo "No .beads/issues.jsonl changes"